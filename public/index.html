<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WithUnion AI</title>

  <link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.min.js" integrity="sha384-9PmP/diBVg7hDN6uMUn4SpBC7n322ZYVykpvvk18h35Gds6qZYqjMWeVBH/gATDu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha384-pZ4gLQJIEk/VKnGk59xUSQK8Ne/erZQR9cpnPXPLB9iN1tXsVkRVfHYGdFYrSkv1" crossorigin="anonymous"></script>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <button class="new-chat" id="newChatButton">
        <span>＋</span>
        <span>New chat</span>
      </button>

    </div>

    <div class="history-title">
      History
    </div>

    <div class="conversations" id="conversationList">

      <div class="empty-history">
        Loading conversations...
      </div>

    </div>

  </aside>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <header class="header">

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="brand">
        AI Assistant
      </div>

      <div class="status">
        ● Online
      </div>

      <button
        class="logout-button"
        id="logoutButton"
        title="Sign out"
      >
        Sign out
      </button>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="messages" id="messages">

        <div class="welcome" id="welcome">

          <div class="welcome-content">

            <div class="welcome-icon">
              ✨
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              Ask me anything. Your conversations are saved automatically.
            </p>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-wrapper">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message WithUnion AI..."
        ></textarea>

        <button
          class="send-button"
          id="sendButton"
          title="Send"
        >
          ↑
        </button>

      </div>

      <div class="input-hint">
        Enter to send · Shift + Enter for new line
      </div>

    </div>

  </main>

</div>


<!-- AUTH -->

<div class="login-screen" id="authScreen">

  <div class="login-box">

    <div class="login-icon">
      🔒
    </div>

    <h1 id="authTitle">
      Sign in
    </h1>

    <p id="authSubtitle">
      Sign in to continue to your conversations.
    </p>

    <input
      type="email"
      id="authEmail"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="authPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="authSubmit">
      Sign in
    </button>

    <div class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <a href="#" id="authToggleLink">Sign up</a>
    </div>

    <div class="login-error" id="authError"></div>

  </div>

</div>


<script src="/app.js"></script>

</body>
</html>
