<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WithUnion AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sidebar: #f7f7f8;
      --border: #e5e5e5;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --hover: #ececec;
      --user: #f4f4f4;
      --accent: #111111;
      --white: #ffffff;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background: var(--white);

      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 14px;
    }

    .new-chat {
      width: 100%;

      border: 1px solid var(--border);
      background: var(--white);

      border-radius: 8px;

      padding: 11px 14px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 9px;

      transition: background 0.15s;
    }

    .new-chat:hover {
      background: var(--hover);
    }

    .history-title {
      padding: 8px 16px;

      font-size: 12px;
      font-weight: 600;

      color: var(--muted);

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .conversations {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .conversation {
      padding: 10px 12px;

      border-radius: 8px;

      cursor: pointer;

      margin-bottom: 2px;

      font-size: 14px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: background 0.15s;
    }

    .conversation:hover {
      background: var(--hover);
    }

    .conversation.active {
      background: #e5e5e5;
      font-weight: 500;
    }

    .empty-history {
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 60px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;

      padding: 0 20px;

      gap: 12px;
    }

    .menu-button {
      display: none;

      border: none;
      background: transparent;

      font-size: 22px;

      cursor: pointer;
    }

    .brand {
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      font-size: 12px;
      color: #16a34a;
      margin-left: auto;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 30px 20px 120px;
    }

    .messages {
      max-width: 850px;
      margin: 0 auto;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: 60vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-content {
      max-width: 600px;
    }

    .welcome-icon {
      font-size: 42px;
      margin-bottom: 16px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 16px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: flex;

      gap: 14px;

      margin-bottom: 28px;

      line-height: 1.6;

      font-size: 15px;
    }

    .avatar {
      width: 32px;
      height: 32px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      font-size: 14px;
      font-weight: 600;
    }

    .message.user .avatar {
      background: #111;
      color: white;
    }

    .message.assistant .avatar {
      background: #e8e8e8;
      color: #222;
    }

    .message-content {
      flex: 1;

      min-width: 0;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
.message-text h1,
.message-text h2,
.message-text h3 {
  margin: 18px 0 10px;
  line-height: 1.3;
}

.message-text p {
  margin: 8px 0;
}

.message-text ul,
.message-text ol {
  margin: 10px 0;
  padding-left: 24px;
}

.message-text li {
  margin: 4px 0;
}

.message-text strong {
  font-weight: 700;
}

.message-text code {
  background: #f1f1f1;
  padding: 2px 5px;
  border-radius: 5px;
  font-family: Consolas, monospace;
  font-size: 0.9em;
}

.message-text pre {
  background: #1e1e1e;
  color: #f5f5f5;
  padding: 16px;
  border-radius: 10px;
  overflow-x: auto;
  margin: 14px 0;
}
.code-wrapper {
  position: relative;
  margin: 14px 0;
}
.code-wrapper pre {
  margin: 0;
  padding-top: 42px;
}
.copy-code-button {
  position: absolute;
  top: 8px;
  right: 8px;
  border: 1px solid #444;
  border-radius: 6px;
  background: #2a2a2a;
  color: #fff;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
}
.copy-code-button:hover {
  background: #3a3a3a;
}

.message-text pre code {
  background: transparent;
  padding: 0;

  color: inherit;

  font-size: 13px;
  line-height: 1.6;
}

.message-text blockquote {
  border-left: 3px solid #aaa;

  padding-left: 14px;

  margin: 12px 0;

  color: #666;
}

    .message-role {
      font-weight: 600;
      margin-bottom: 3px;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: flex;
      gap: 5px;
      padding-top: 8px;
    }

    .typing span {
      width: 7px;
      height: 7px;

      background: #888;

      border-radius: 50%;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      position: fixed;

      bottom: 0;
      right: 0;

      left: 280px;

      padding: 18px 20px 24px;

      background: linear-gradient(
        transparent,
        white 35%
      );
    }

    .input-wrapper {
      max-width: 850px;

      margin: 0 auto;

      border: 1px solid #d9d9d9;

      border-radius: 14px;

      background: white;

      display: flex;

      align-items: flex-end;

      padding: 10px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.05);
    }

    textarea {
      flex: 1;

      border: none;
      outline: none;

      resize: none;

      max-height: 180px;

      padding: 8px;

      font-family: inherit;

      font-size: 15px;

      line-height: 1.5;

      background: transparent;
    }

    .send-button {
      width: 38px;
      height: 38px;

      border: none;

      border-radius: 9px;

      background: #111;

      color: white;

      cursor: pointer;

      font-size: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button:hover {
      background: #333;
    }

    .send-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-hint {
      max-width: 850px;

      margin: 7px auto 0;

      text-align: center;

      font-size: 11px;

      color: #888;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;

        z-index: 100;

        left: 0;
        top: 0;
        bottom: 0;

        transform: translateX(-100%);

        box-shadow: 4px 0 15px rgba(0,0,0,0.1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-button {
        display: block;
      }

      .input-area {
        left: 0;
      }

      .header {
        padding: 0 14px;
      }

      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }

      .welcome h1 {
        font-size: 26px;
      }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.min.js" integrity="sha384-9PmP/diBVg7hDN6uMUn4SpBC7n322ZYVykpvvk18h35Gds6qZYqjMWeVBH/gATDu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js" integrity="sha384-pZ4gLQJIEk/VKnGk59xUSQK8Ne/erZQR9cpnPXPLB9iN1tXsVkRVfHYGdFYrSkv1" crossorigin="anonymous"></script>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <button class="new-chat" id="newChatButton">
        <span>＋</span>
        <span>New chat</span>
      </button>

    </div>

    <div class="history-title">
      History
    </div>

    <div class="conversations" id="conversationList">

      <div class="empty-history">
        Loading conversations...
      </div>

    </div>

  </aside>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">

    <header class="header">

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="brand">
        AI Assistant
      </div>

      <div class="status">
        ● Online
      </div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="messages" id="messages">

        <div class="welcome" id="welcome">

          <div class="welcome-content">

            <div class="welcome-icon">
              ✨
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              Ask me anything. Your conversations are saved automatically.
            </p>

          </div>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-wrapper">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message WithUnion AI..."
        ></textarea>

        <button
          class="send-button"
          id="sendButton"
          title="Send"
        >
          ↑
        </button>

      </div>

      <div class="input-hint">
        Enter to send · Shift + Enter for new line
      </div>

    </div>

  </main>

</div>


<script>

  // ==========================================
  // STATE
  // ==========================================

  let currentConversationId = null;
  let isSending = false;


  // ==========================================
  // ELEMENTS
  // ==========================================

  const conversationList =
    document.getElementById("conversationList");

  const messages =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const newChatButton =
    document.getElementById("newChatButton");

  const welcome =
    document.getElementById("welcome");

  const sidebar =
    document.getElementById("sidebar");

  const menuButton =
    document.getElementById("menuButton");


  // ==========================================
  // LOAD CONVERSATIONS
  // ==========================================

  async function loadConversations() {

    try {

      const response =
        await fetch("/api/conversations");

      if (!response.ok) {
        throw new Error("Failed to load conversations");
      }

      const conversations =
        await response.json();

      renderConversations(conversations);

    } catch (error) {

      console.error(error);

      conversationList.innerHTML = `
        <div class="empty-history">
          Failed to load conversations.
        </div>
      `;

    }

  }


  // ==========================================
  // RENDER CONVERSATIONS
  // ==========================================

  function renderConversations(conversations) {

    if (!conversations.length) {

      conversationList.innerHTML = `
        <div class="empty-history">
          No conversations yet.
        </div>
      `;

      return;
    }

    conversationList.innerHTML = "";

    conversations.forEach(conversation => {

      const item =
        document.createElement("div");

      item.className = "conversation";

      if (
        conversation.id === currentConversationId
      ) {
        item.classList.add("active");
      }

      item.textContent =
        conversation.title || "New conversation";

      item.title =
        conversation.title || "New conversation";

      item.addEventListener(
        "click",
        () => {
          openConversation(conversation.id);
        }
      );

      conversationList.appendChild(item);

    });

  }


  // ==========================================
  // OPEN CONVERSATION
  // ==========================================

  async function openConversation(id) {

    try {

      const response =
        await fetch(`/api/conversations/${id}`);

      if (!response.ok) {
        throw new Error("Conversation not found");
      }

      const data =
        await response.json();

      currentConversationId = id;

      renderMessages(data.messages);

      await loadConversations();

      sidebar.classList.remove("open");

    } catch (error) {

      console.error(error);

      alert("Could not load this conversation.");

    }

  }


  // ==========================================
  // RENDER MESSAGES
  // ==========================================

  function renderMessages(messageList) {

    messages.innerHTML = "";

    const visibleMessages =
      messageList.filter(
        message => message.role !== "system"
      );

    if (!visibleMessages.length) {

      messages.appendChild(
        createWelcome()
      );

      return;

    }

    visibleMessages.forEach(message => {

      addMessageToUI(
        message.role,
        message.content
      );

    });

    scrollToBottom();

  }


  // ==========================================
  // WELCOME
  // ==========================================

  function createWelcome() {

    const div =
      document.createElement("div");

    div.className = "welcome";

    div.innerHTML = `
      <div class="welcome-content">
        <div class="welcome-icon">✨</div>

        <h1>
          How can WithUnion AI help you?
        </h1>

        <p>
          Ask me anything. Your conversations are saved automatically.
        </p>
      </div>
    `;

    return div;

  }


  // ==========================================
  // ADD MESSAGE TO UI
  // ==========================================

function addMessageToUI(role, content) {
  const message =
    document.createElement("div");
  message.className =
    `message ${role}`;
  const avatar =
    role === "user"
      ? "E"
      : "WU";
  const roleName =
    role === "user"
      ? "You"
      : "WithUnion AI";
  message.innerHTML = `
    <div class="avatar">
      ${avatar}
    </div>
    <div class="message-content">
      <div class="message-role">
        ${roleName}
      </div>
      <div class="message-text"></div>
    </div>
  `;
  const text =
    message.querySelector(".message-text");
  if (role === "assistant") {
    const rawHTML = marked.parse(content);
    const safeHTML = DOMPurify.sanitize(rawHTML);
    text.innerHTML = safeHTML;
    text.querySelectorAll("pre code").forEach(block => {
      hljs.highlightElement(block);
      const pre = block.parentElement;
      const wrapper = document.createElement("div");
      wrapper.className = "code-wrapper";
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);
      const copyButton = document.createElement("button");
      copyButton.className = "copy-code-button";
      copyButton.textContent = "Copy";
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(
            block.textContent
          );
          copyButton.textContent = "Copied!";
          setTimeout(() => {
            copyButton.textContent = "Copy";
          }, 1500);
        } catch (error) {
          console.error(
            "Copy failed:",
            error
          );
        }
      });
      wrapper.appendChild(copyButton);
    });
  } else {
    text.textContent = content;
  }
  messages.appendChild(message);
}

  // ==========================================
  // NEW CHAT
  // ==========================================

  async function newChat() {

    try {

      const response =
        await fetch(
          "/api/conversations",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

      if (!response.ok) {
        throw new Error(
          "Failed to create conversation"
        );
      }

      const data =
        await response.json();

      currentConversationId =
        data.conversationId;

      messages.innerHTML = "";

      messages.appendChild(
        createWelcome()
      );

      messageInput.focus();

      await loadConversations();

    } catch (error) {

      console.error(error);

      alert("Could not create a new chat.");

    }

  }


  // ==========================================
  // SEND MESSAGE
  // ==========================================

  async function sendMessage() {

    const message =
      messageInput.value.trim();

    if (!message || isSending) {
      return;
    }

    isSending = true;

    sendButton.disabled = true;

    // Remove welcome screen
    const welcomeElement =
      messages.querySelector(".welcome");

    if (welcomeElement) {
      welcomeElement.remove();
    }

    // Add user message
    addMessageToUI(
      "user",
      message
    );

    messageInput.value = "";

    autoResize();

    scrollToBottom();

    // Typing indicator
    const typing =
      document.createElement("div");

    typing.className =
      "message assistant";

    typing.id =
      "typingIndicator";

    typing.innerHTML = `
      <div class="avatar">
        AI
      </div>

      <div class="message-content">

        <div class="message-role">
          WithUnion AI        
      </div>

        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>
    `;

    messages.appendChild(typing);

    scrollToBottom();


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message,
              conversationId:
                currentConversationId
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Request failed"
        );

      }

      // Save conversation ID
      currentConversationId =
        data.conversationId;

      // Remove typing indicator
      document
        .getElementById("typingIndicator")
        ?.remove();

      // Add AI response
      addMessageToUI(
        "assistant",
        data.answer
      );

      await loadConversations();

      scrollToBottom();

    } catch (error) {

      console.error(error);

      document
        .getElementById("typingIndicator")
        ?.remove();

      addMessageToUI(
        "assistant",
        "Sorry, something went wrong. Please try again."
      );

    } finally {

      isSending = false;

      sendButton.disabled = false;

      messageInput.focus();

    }

  }


  // ==========================================
  // SCROLL
  // ==========================================

  function scrollToBottom() {

    const chat =
      document.getElementById("chat");

    setTimeout(() => {

      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });

    }, 50);

  }


  // ==========================================
  // AUTO RESIZE
  // ==========================================

  function autoResize() {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        180
      ) + "px";

  }


  // ==========================================
  // EVENTS
  // ==========================================

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  newChatButton.addEventListener(
    "click",
    newChat
  );

  messageInput.addEventListener(
    "input",
    autoResize
  );

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );

  menuButton.addEventListener(
    "click",
    () => {

      sidebar.classList.toggle("open");

    }
  );


  // ==========================================
  // INITIALIZE
  // ==========================================

  loadConversations();

  messageInput.focus();

</script>

</body>
</html>
