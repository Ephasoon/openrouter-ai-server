<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 900px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            margin: 4px 0 0;
            opacity: 0.85;
            font-size: 13px;
        }

        #clearButton {
            background: white;
            color: #2563eb;
            padding: 8px 12px;
            font-size: 13px;
        }

        #clearButton:hover {
            background: #e5e7eb;
        }

        #chat {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 18px;
            padding: 14px 17px;
            border-radius: 14px;
            max-width: 80%;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .ai {
            background: white;
            color: #222;
            border: 1px solid #ddd;
        }

        .label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-top: 100px;
        }

        .typing {
            opacity: 0.7;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>🤖 My AI Chat</h1>
            <p>Powered by OpenRouter</p>
        </div>

        <button id="clearButton">
            New Chat
        </button>
    </header>

    <div id="chat">

        <div class="welcome">
            <h2>Hello! 👋</h2>
            <p>Ask me anything.</p>
        </div>

    </div>

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Message AI..."
            autocomplete="off"
        />

        <button id="sendButton">
            Send
        </button>

    </div>

</div>

<script>

let conversationId = null;

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const clearButton = document.getElementById("clearButton");

function addMessage(sender, text, type) {

    const messageDiv = document.createElement("div");

    messageDiv.classList.add("message", type);

    const label = document.createElement("div");

    label.classList.add("label");

    label.textContent = sender;

    const content = document.createElement("div");

    content.textContent = text;

    messageDiv.appendChild(label);
    messageDiv.appendChild(content);

    chat.appendChild(messageDiv);

    chat.scrollTop = chat.scrollHeight;

    return messageDiv;
}

function showWelcome() {

    chat.innerHTML = `
        <div class="welcome">
            <h2>Hello! 👋</h2>
            <p>Ask me anything.</p>
        </div>
    `;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message || sendButton.disabled) {
        return;
    }

    // Remove welcome screen
    const welcome = chat.querySelector(".welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage("You", message, "user");

    input.value = "";

    sendButton.disabled = true;

    const thinkingMessage = addMessage(
        "AI",
        "Thinking...",
        "ai"
    );

    thinkingMessage.classList.add("typing");

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                conversationId: conversationId
            })

        });

        const data = await response.json();

        thinkingMessage.remove();

        if (!response.ok) {

            addMessage(
                "AI",
                data.error || "Something went wrong.",
                "ai"
            );

            return;
        }

        conversationId = data.conversationId;

        addMessage(
            "AI",
            data.answer,
            "ai"
        );

    } catch (error) {

        thinkingMessage.remove();

        addMessage(
            "AI",
            "Could not connect to the server.",
            "ai"
        );

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}

function newChat() {

    conversationId = null;

    showWelcome();

    input.value = "";

    input.focus();
}

sendButton.addEventListener("click", sendMessage);

clearButton.addEventListener("click", newChat);

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

input.focus();

</script>

</body>
</html>
